<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts WebXR Teljes Test & Pálca</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #555;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #f0c040; }
        p { margin: 5px 0; font-size: 14px; color: #ddd; }
    </style>
    <!-- Three.js importálás CDN-ről -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay">
        <h1>⚡ Roxfort WebXR - Test & Pálca</h1>
        <p>• <b>Test:</b> Látod a saját törzsedet, vállaidat és kezeidet VR-ban.</p>
        <p>• <b>Grip (Markolat):</b> Nyúlj a jobb csípődhöz az övhöz, és vedd fel a pálcát.</p>
        <p>• <b>Trigger (Mutatóujj):</b> Varázslás (Lövés a pálca hegyéből).</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        let camera, scene, renderer;
        let controller1, controller2;
        let wandGroup, wandTipMesh;
        let isWandInHand = false;
        let activeController = null;

        // Test és öv referenciák
        const playerBody = new THREE.Group();
        let torsoMesh, leftShoulderMesh, rightShoulderMesh;
        const beltHolster = new THREE.Group();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x04040a);
            scene.fog = new THREE.FogExp2(0x04040a, 0.03);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 0);

            // Fények
            const ambient = new THREE.AmbientLight(0x303050, 2);
            scene.add(ambient);

            const moon = new THREE.DirectionalLight(0x7799ff, 2);
            moon.position.set(5, 15, 5);
            scene.add(moon);

            // Roxfort Nagy Terem / Pince környezet
            createHogwartsEnvironment();

            // Renderer & WebXR beállítás
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // Játékos Teste (Törzs, vállak, kezek)
            scene.add(playerBody);
            createPlayerAvatar();

            // VR Kontrollerek
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onTriggerDown);
            controller1.addEventListener('squeezestart', () => onGripDown(controller1));
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onTriggerDown);
            controller2.addEventListener('squeezestart', () => onGripDown(controller2));
            scene.add(controller2);

            // Vizuális kézfejek a kontrollereken
            createHandVisual(controller1);
            createHandVisual(controller2);

            // Pálca felépítése
            wandGroup = new THREE.Group();
            const wandGeo = new THREE.CylinderGeometry(0.004, 0.008, 0.35, 16);
            wandGeo.rotateX(Math.PI / 2);
            wandGeo.translate(0, 0, -0.175);
            const wandMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.5 });
            const wandMesh = new THREE.Mesh(wandGeo, wandMat);
            wandGroup.add(wandMesh);

            // Lumos / Pálca hegye
            const tipGeo = new THREE.SphereGeometry(0.012, 16, 16);
            const tipMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            wandTipMesh = new THREE.Mesh(tipGeo, tipMat);
            wandTipMesh.position.set(0, 0, -0.35);
            wandGroup.add(wandTipMesh);

            // Öv / Pálcatartó a derekon
            scene.add(beltHolster);
            const holsterGeo = new THREE.CylinderGeometry(0.02, 0.015, 0.18, 12);
            const holsterMat = new THREE.MeshStandardMaterial({ color: 0x1a0d00 });
            const holsterMesh = new THREE.Mesh(holsterGeo, holsterMat);
            holsterMesh.rotation.z = Math.PI / 6;
            beltHolster.add(holsterMesh);

            // Kezdetben az övön van a pálca
            attachWandToHolster();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        // Karakter testalkat (törzs és vállak, hogy lásd magad)
        function createPlayerAvatar() {
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 }); // Roxforti fekete/sötétkék köpeny

            // Törzs (mellkas)
            torsoMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.55, 16), bodyMat);
            playerBody.add(torsoMesh);

            // Vállak
            const shoulderMat = new THREE.MeshStandardMaterial({ color: 0x22223b, roughness: 0.8 });
            leftShoulderMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), shoulderMat);
            rightShoulderMesh = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), shoulderMat);
            
            leftShoulderMesh.position.set(-0.22, 0.22, 0);
            rightShoulderMesh.position.set(0.22, 0.22, 0);
            
            playerBody.add(leftShoulderMesh);
            playerBody.add(rightShoulderMesh);
        }

        function createHandVisual(controller) {
            const handMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.038, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.7 })
            );
            handMesh.scale.set(1, 0.6, 1.3);
            controller.add(handMesh);
        }

        function attachWandToHolster() {
            isWandInHand = false;
            activeController = null;
            beltHolster.add(wandGroup);
            wandGroup.position.set(0, 0, 0);
            wandGroup.rotation.set(Math.PI / 4, 0, 0);
        }

        function onGripDown(controller) {
            const handPos = new THREE.Vector3();
            controller.getWorldPosition(handPos);

            const holsterPos = new THREE.Vector3();
            beltHolster.getWorldPosition(holsterPos);

            if (!isWandInHand) {
                // Ha a jobb/bal kéz a csípőhöz közel nyúl (< 35cm), felveszi
                if (handPos.distanceTo(holsterPos) < 0.35) {
                    isWandInHand = true;
                    activeController = controller;
                    controller.add(wandGroup);
                    wandGroup.position.set(0, 0, 0);
                    wandGroup.rotation.set(0, 0, 0);
                }
            } else if (activeController === controller) {
                // Ha visszanyúlsz a csípőhöz, elteszed
                if (handPos.distanceTo(holsterPos) < 0.35) {
                    attachWandToHolster();
                }
            }
        }

        function onTriggerDown(event) {
            const controller = event.target;
            if (!isWandInHand || activeController !== controller) return;

            // Varázslat lövése pontosan a pálca hegyéből
            const tipWorldPos = new THREE.Vector3();
            wandTipMesh.getWorldPosition(tipWorldPos);

            const wandDirection = new THREE.Vector3();
            wandGroup.getWorldDirection(wandDirection);
            wandDirection.negate();

            const spellGeo = new THREE.SphereGeometry(0.035, 16, 16);
            const spellMat = new THREE.MeshBasicMaterial({ color: 0xff1133 });
            const spell = new THREE.Mesh(spellGeo, spellMat);

            const spellLight = new THREE.PointLight(0xff1133, 4, 4);
            spell.add(spellLight);

            spell.position.copy(tipWorldPos);
            scene.add(spell);

            const speed = 0.5;
            const interval = setInterval(() => {
                spell.position.addScaledVector(wandDirection, speed);
                if (spell.position.distanceTo(tipWorldPos) > 30) {
                    scene.remove(spell);
                    spell.geometry.dispose();
                    spell.material.dispose();
                    clearInterval(interval);
                }
            }, 16);
        }

        function createHogwartsEnvironment() {
            // Padló
            const floorGeo = new THREE.PlaneGeometry(35, 35);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Kőoszlopok
            const pillarGeo = new THREE.CylinderGeometry(0.45, 0.55, 9, 16);
            const pillarMat = new THREE.MeshStandardMaterial({ color: 0x22222d });

            for (let x of [-5, 5]) {
                for (let z of [-10, -5, 0, 5, 10]) {
                    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                    pillar.position.set(x, 4.5, z);
                    scene.add(pillar);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render() {
            if (renderer.xr.isPresenting) {
                const xrCamera = renderer.xr.getCamera();
                const headPos = new THREE.Vector3();
                xrCamera.getWorldPosition(headPos);

                // A test pozícióját a headset alatt kötjük be (fej alatt lejjebb tolva)
                playerBody.position.set(headPos.x, headPos.y - 0.45, headPos.z);
                playerBody.rotation.y = xrCamera.rotation.y;

                // Az öv/holster fixen a jobb csípőnél helyezkedik el a testhez képest
                beltHolster.position.set(headPos.x + 0.22, headPos.y - 0.55, headPos.z);
                beltHolster.rotation.y = xrCamera.rotation.y;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
