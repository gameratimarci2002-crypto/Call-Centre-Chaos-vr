<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Great Hall - Ultimate VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #d4af37;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #f0c040; }
        p { margin: 5px 0; font-size: 14px; color: #ddd; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay">
        <h1>⚡ Roxfort Nagy Terem (V.2)</h1>
        <p>• <b>Grip:</b> Pálca felvétele a jobb csípőmről</p>
        <p>• <b>Trigger:</b> Varázslat indítása a pálca hegyéből</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        let camera, scene, renderer;
        let controller1, controller2;
        let wandGroup, wandTipMesh;
        let isWandInHand = false;
        let activeController = null;

        const playerBody = new THREE.Group();
        const beltHolster = new THREE.Group();
        const floatingCandles = [];

        const headPos = new THREE.Vector3();
        const headDir = new THREE.Vector3();

        init();

        function init() {
            scene = new THREE.Scene();
            // Varázslatos éjszakai égbolt szín
            scene.background = new THREE.Color(0x01010a);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 150);
            camera.position.set(0, 1.6, 10);

            // Fények a Nagy Teremhez
            const ambient = new THREE.AmbientLight(0x223355, 1.5);
            scene.add(ambient);

            // Meleg kandallófény a falak felől
            const fireLight1 = new THREE.PointLight(0xff7722, 2, 25);
            fireLight1.position.set(-6, 3, 0);
            scene.add(fireLight1);

            const fireLight2 = new THREE.PointLight(0xff7722, 2, 25);
            fireLight2.position.set(6, 3, 0);
            scene.add(fireLight2);

            // ÚJ, RÉSZLETES NAGY TEREM PÁLYA BETÖLTÉSE
            createDetailedGreatHall();

            // Renderer & WebXR
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // Test és Öv
            scene.add(playerBody);
            scene.add(beltHolster);
            createPlayerAvatar();

            // VR Kontrollerek
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onTriggerDown);
            controller1.addEventListener('squeezestart', () => onGripDown(controller1));
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onTriggerDown);
            controller2.addEventListener('squeezestart', () => onGripDown(controller2));
            scene.add(controller2);

            createHandVisual(controller1);
            createHandVisual(controller2);

            // Pálca
            wandGroup = new THREE.Group();
            const wandGeo = new THREE.CylinderGeometry(0.004, 0.008, 0.35, 16);
            wandGeo.rotateX(Math.PI / 2);
            wandGeo.translate(0, 0, -0.175);
            const wandMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.5 });
            const wandMesh = new THREE.Mesh(wandGeo, wandMat);
            wandGroup.add(wandMesh);

            const tipGeo = new THREE.SphereGeometry(0.012, 16, 16);
            const tipMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            wandTipMesh = new THREE.Mesh(tipGeo, tipMat);
            wandTipMesh.position.set(0, 0, -0.35);
            wandGroup.add(wandTipMesh);

            // Öv hüvely
            const holsterGeo = new THREE.CylinderGeometry(0.02, 0.015, 0.18, 12);
            const holsterMat = new THREE.MeshStandardMaterial({ color: 0x1a0d00 });
            const holsterMesh = new THREE.Mesh(holsterGeo, holsterMat);
            holsterMesh.rotation.z = Math.PI / 6;
            beltHolster.add(holsterMesh);

            attachWandToHolster();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        function createPlayerAvatar() {
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.55, 16), bodyMat);
            torso.position.set(0, -0.45, -0.05);
            playerBody.add(torso);

            const leftShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), bodyMat);
            leftShoulder.position.set(-0.20, -0.22, -0.05);
            playerBody.add(leftShoulder);

            const rightShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), bodyMat);
            rightShoulder.position.set(0.20, -0.22, -0.05);
            playerBody.add(rightShoulder);
        }

        function createHandVisual(controller) {
            const handMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.038, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.7 })
            );
            handMesh.scale.set(1, 0.6, 1.3);
            controller.add(handMesh);
        }

        // --- TELJESEN ÚJ, RÉSZLETES NAGY TEREM PÁLYA ---
        function createDetailedGreatHall() {
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x1b1b22, roughness: 0.9 });
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x282835, roughness: 0.8 });
            const woodDark = new THREE.MeshStandardMaterial({ color: 0x2b170b, roughness: 0.6 });
            const goldMat = new THREE.MeshStandardMaterial({ color: 0xc9a050, metalness: 0.8, roughness: 0.2 });

            // 1. Padló (Kőlapok)
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 36), stoneMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 2. Emelvény a terem végén (Tanári asztalok helye)
            const dais = new THREE.Mesh(new THREE.BoxGeometry(18, 0.2, 5), stoneMat);
            dais.position.set(0, 0.1, -14);
            scene.add(dais);

            // 3. Impozáns falak és oszlopok
            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 12, 36), wallMat);
            leftWall.position.set(-10, 6, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.6, 12, 36), wallMat);
            rightWall.position.set(10, 6, 0);
            scene.add(rightWall);

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(20, 12, 0.6), wallMat);
            backWall.position.set(0, 6, -18);
            scene.add(backWall);

            // 4. Házak Hosszú Asztalai (Sötétfa + Arany díszítés)
            const tableGeo = new THREE.BoxGeometry(1.6, 0.75, 22);
            const benchGeo = new THREE.BoxGeometry(0.4, 0.45, 22);

            [-5, -1.7, 1.7, 5].forEach(x => {
                const table = new THREE.Mesh(tableGeo, woodDark);
                table.position.set(x, 0.375, 2);
                scene.add(table);

                const benchL = new THREE.Mesh(benchGeo, woodDark);
                benchL.position.set(x - 0.7, 0.22, 2);
                scene.add(benchL);

                const benchR = new THREE.Mesh(benchGeo, woodDark);
                benchR.position.set(x + 0.7, 0.22, 2);
                scene.add(benchR);
            });

            // 5. Tanári Főasztal az emelvényen
            const teacherTable = new THREE.Mesh(new THREE.BoxGeometry(14, 0.85, 1.8), goldMat);
            teacherTable.position.set(0, 0.525, -14);
            scene.add(teacherTable);

            // 6. Lebegő Gyertyák a plafon alatt (Varázslatos mennyezet illúzió)
            const candleGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.3, 8);
            const candleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            for (let i = 0; i < 50; i++) {
                const group = new THREE.Group();
                const candle = new THREE.Mesh(candleGeo, candleMat);
                group.add(candle);

                const flame = new THREE.PointLight(0xffaa22, 1.2, 5);
                flame.position.set(0, 0.2, 0);
                group.add(flame);

                const rx = (Math.random() - 0.5) * 16;
                const ry = 5 + Math.random() * 3;
                const rz = (Math.random() - 0.5) * 30;

                group.position.set(rx, ry, rz);
                scene.add(group);

                floatingCandles.push({
                    group: group,
                    baseY: ry,
                    offset: Math.random() * Math.PI * 2
                });
            }
        }

        function attachWandToHolster() {
            isWandInHand = false;
            activeController = null;
            beltHolster.add(wandGroup);
            wandGroup.position.set(0, 0, 0);
            wandGroup.rotation.set(Math.PI / 4, 0, 0);
        }

        function onGripDown(controller) {
            const handPos = new THREE.Vector3();
            controller.getWorldPosition(handPos);

            const holsterPos = new THREE.Vector3();
            beltHolster.getWorldPosition(holsterPos);

            if (!isWandInHand) {
                if (handPos.distanceTo(holsterPos) < 0.4) {
                    isWandInHand = true;
                    activeController = controller;
                    controller.add(wandGroup);
                    wandGroup.position.set(0, 0, 0);
                    wandGroup.rotation.set(0, 0, 0);
                }
            } else if (activeController === controller) {
                if (handPos.distanceTo(holsterPos) < 0.4) {
                    attachWandToHolster();
                }
            }
        }

        function onTriggerDown(event) {
            const controller = event.target;
            if (!isWandInHand || activeController !== controller) return;

            const tipWorldPos = new THREE.Vector3();
            wandTipMesh.getWorldPosition(tipWorldPos);

            const wandDirection = new THREE.Vector3();
            wandGroup.getWorldDirection(wandDirection);
            wandDirection.negate();

            const spellGeo = new THREE.SphereGeometry(0.035, 16, 16);
            const spellMat = new THREE.MeshBasicMaterial({ color: 0xff1133 });
            const spell = new THREE.Mesh(spellGeo, spellMat);

            const spellLight = new THREE.PointLight(0xff1133, 5, 4);
            spell.add(spellLight);

            spell.position.copy(tipWorldPos);
            scene.add(spell);

            const speed = 0.5;
            const interval = setInterval(() => {
                spell.position.addScaledVector(wandDirection, speed);
                if (spell.position.distanceTo(tipWorldPos) > 35) {
                    scene.remove(spell);
                    spell.geometry.dispose();
                    spell.material.dispose();
                    clearInterval(interval);
                }
            }, 16);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(time) {
            const t = time * 0.0015;
            floatingCandles.forEach(c => {
                c.group.position.y = c.baseY + Math.sin(t + c.offset) * 0.15;
            });

            if (renderer.xr.isPresenting) {
                const xrCamera = renderer.xr.getCamera();
                xrCamera.getWorldPosition(headPos);
                xrCamera.getWorldDirection(headDir);

                const yaw = Math.atan2(headDir.x, headDir.z) + Math.PI;

                playerBody.position.set(headPos.x, headPos.y, headPos.z);
                playerBody.rotation.y = yaw;

                const sideOffset = new THREE.Vector3(0.22, -0.55, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                beltHolster.position.copy(headPos).add(sideOffset);
                beltHolster.rotation.y = yaw;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
