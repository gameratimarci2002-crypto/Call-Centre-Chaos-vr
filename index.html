<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Great Hall WebXR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            z-index: 10;
            background: rgba(0,0,0,0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d4af37;
        }
        h1 { margin: 0 0 10px 0; font-size: 18px; color: #f0c040; }
        p { margin: 5px 0; font-size: 14px; color: #ddd; }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="overlay">
        <h1>⚡ Roxfort Nagy Terem - WebXR</h1>
        <p>• <b>Grip (Markolat):</b> Nyúlj a jobb csípődhöz az övhöz, és vedd fel a pálcát.</p>
        <p>• <b>Trigger (Mutatóujj):</b> Varázslás (Stupefy lövés a pálca hegyéből).</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { VRButton } from 'three/addons/webxr/VRButton.js';

        let camera, scene, renderer;
        let controller1, controller2;
        let wandGroup, wandTipMesh;
        let isWandInHand = false;
        let activeController = null;

        // Test és Öv
        const playerBody = new THREE.Group();
        const beltHolster = new THREE.Group();
        const floatingCandles = [];

        // Vektorok a pozicionáláshoz
        const headPos = new THREE.Vector3();
        const headDir = new THREE.Vector3();

        init();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020208);
            scene.fog = new THREE.FogExp2(0x020208, 0.025);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 1.6, 8);

            // Ambient és holdfény az ablakok felől
            const ambient = new THREE.AmbientLight(0x334466, 1.2);
            scene.add(ambient);

            const windowLight = new THREE.DirectionalLight(0x6688cc, 2);
            windowLight.position.set(-15, 12, 0);
            scene.add(windowLight);

            // ROXFORT NAGY TEREM PÁLYA ÉPÍTÉSE
            createHogwartsGreatHall();

            // Renderer & WebXR
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);
            document.body.appendChild(VRButton.createButton(renderer));

            // Test és Öv bekötése
            scene.add(playerBody);
            scene.add(beltHolster);
            createPlayerAvatar();

            // VR Kontrollerek
            controller1 = renderer.xr.getController(0);
            controller1.addEventListener('selectstart', onTriggerDown);
            controller1.addEventListener('squeezestart', () => onGripDown(controller1));
            scene.add(controller1);

            controller2 = renderer.xr.getController(1);
            controller2.addEventListener('selectstart', onTriggerDown);
            controller2.addEventListener('squeezestart', () => onGripDown(controller2));
            scene.add(controller2);

            // Kézfejek
            createHandVisual(controller1);
            createHandVisual(controller2);

            // PÁLCA ÉPÍTÉSE
            wandGroup = new THREE.Group();
            const wandGeo = new THREE.CylinderGeometry(0.004, 0.008, 0.35, 16);
            wandGeo.rotateX(Math.PI / 2);
            wandGeo.translate(0, 0, -0.175);
            const wandMat = new THREE.MeshStandardMaterial({ color: 0x3d2314, roughness: 0.5 });
            const wandMesh = new THREE.Mesh(wandGeo, wandMat);
            wandGroup.add(wandMesh);

            // Lumos / Pálca hegye
            const tipGeo = new THREE.SphereGeometry(0.012, 16, 16);
            const tipMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            wandTipMesh = new THREE.Mesh(tipGeo, tipMat);
            wandTipMesh.position.set(0, 0, -0.35);
            wandGroup.add(wandTipMesh);

            // Öv hüvely
            const holsterGeo = new THREE.CylinderGeometry(0.02, 0.015, 0.18, 12);
            const holsterMat = new THREE.MeshStandardMaterial({ color: 0x1a0d00 });
            const holsterMesh = new THREE.Mesh(holsterGeo, holsterMat);
            holsterMesh.rotation.z = Math.PI / 6;
            beltHolster.add(holsterMesh);

            // Alapból az övön van a pálca
            attachWandToHolster();

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(render);
        }

        // KARAKTER TEST (KORRIGÁLT POZÍCIÓVAL)
        function createPlayerAvatar() {
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.9 });

            // Törzs - kicsit lejjebb és háttrébb, hogy ne takarja a látóteret
            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.14, 0.55, 16), bodyMat);
            torso.position.set(0, -0.45, -0.05);
            playerBody.add(torso);

            // Vállak
            const leftShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), bodyMat);
            leftShoulder.position.set(-0.20, -0.22, -0.05);
            playerBody.add(leftShoulder);

            const rightShoulder = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 16), bodyMat);
            rightShoulder.position.set(0.20, -0.22, -0.05);
            playerBody.add(rightShoulder);
        }

        function createHandVisual(controller) {
            const handMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.038, 16, 16),
                new THREE.MeshStandardMaterial({ color: 0xd2b48c, roughness: 0.7 })
            );
            handMesh.scale.set(1, 0.6, 1.3);
            controller.add(handMesh);
        }

        // PÁLYA: ROXFORT NAGY TEREM GENERÁLÁSA
        function createHogwartsGreatHall() {
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x22222a, roughness: 0.8 });
            const woodMat = new THREE.MeshStandardMaterial({ color: 0x3a2212, roughness: 0.7 });
            const stoneMat = new THREE.MeshStandardMaterial({ color: 0x15151e, roughness: 0.9 });

            // 1. Padló
            const floorGeo = new THREE.PlaneGeometry(16, 30);
            const floor = new THREE.Mesh(floorGeo, stoneMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // 2. Falak
            const backWall = new THREE.Mesh(new THREE.BoxGeometry(16, 10, 0.5), wallMat);
            backWall.position.set(0, 5, -15);
            scene.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(16, 10, 0.5), wallMat);
            frontWall.position.set(0, 5, 15);
            scene.add(frontWall);

            const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 10, 30), wallMat);
            leftWall.position.set(-8, 5, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 10, 30), wallMat);
            rightWall.position.set(8, 5, 0);
            scene.add(rightWall);

            // 3. Gótikus Oszlopok a falak mentén
            const pillarGeo = new THREE.CylinderGeometry(0.4, 0.5, 10, 16);
            for (let z = -12; z <= 12; z += 6) {
                const pLeft = new THREE.Mesh(pillarGeo, wallMat);
                pLeft.position.set(-7.5, 5, z);
                scene.add(pLeft);

                const pRight = new THREE.Mesh(pillarGeo, wallMat);
                pRight.position.set(7.5, 5, z);
                scene.add(pRight);
            }

            // 4. Házak Asztalai (4 Hosszú Asztal Padokkal)
            const tableGeo = new THREE.BoxGeometry(1.8, 0.7, 18);
            const benchGeo = new THREE.BoxGeometry(0.5, 0.4, 18);

            const tablePositions = [-4.5, -1.8, 1.8, 4.5];
            tablePositions.forEach((x) => {
                const table = new THREE.Mesh(tableGeo, woodMat);
                table.position.set(x, 0.35, 0);
                scene.add(table);

                const benchLeft = new THREE.Mesh(benchGeo, woodMat);
                benchLeft.position.set(x - 0.7, 0.2, 0);
                scene.add(benchLeft);

                const benchRight = new THREE.Mesh(benchGeo, woodMat);
                benchRight.position.set(x + 0.7, 0.2, 0);
                scene.add(benchRight);
            });

            // 5. Tanári Katedra Asztal a terem elején
            const teacherTable = new THREE.Mesh(new THREE.BoxGeometry(12, 0.8, 1.5), woodMat);
            teacherTable.position.set(0, 0.4, -12);
            scene.add(teacherTable);

            // 6. Lebegő Gyertyák meleg fénnyel
            const candleGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.25, 8);
            const candleMat = new THREE.MeshBasicMaterial({ color: 0xfff5cc });

            for (let i = 0; i < 40; i++) {
                const candleGroup = new THREE.Group();
                const candle = new THREE.Mesh(candleGeo, candleMat);
                candleGroup.add(candle);

                const flame = new THREE.PointLight(0xffaa33, 1.5, 4);
                flame.position.set(0, 0.15, 0);
                candleGroup.add(flame);

                const rx = (Math.random() - 0.5) * 12;
                const ry = 4 + Math.random() * 2.5;
                const rz = (Math.random() - 0.5) * 22;

                candleGroup.position.set(rx, ry, rz);
                scene.add(candleGroup);

                // Animációhoz elmentjük az alap Y pozíciót és egy egyedi eltolást
                floatingCandles.push({
                    group: candleGroup,
                    baseY: ry,
                    offset: Math.random() * Math.PI * 2
                });
            }
        }

        function attachWandToHolster() {
            isWandInHand = false;
            activeController = null;
            beltHolster.add(wandGroup);
            wandGroup.position.set(0, 0, 0);
            wandGroup.rotation.set(Math.PI / 4, 0, 0);
        }

        function onGripDown(controller) {
            const handPos = new THREE.Vector3();
            controller.getWorldPosition(handPos);

            const holsterPos = new THREE.Vector3();
            beltHolster.getWorldPosition(holsterPos);

            if (!isWandInHand) {
                if (handPos.distanceTo(holsterPos) < 0.4) {
                    isWandInHand = true;
                    activeController = controller;
                    controller.add(wandGroup);
                    wandGroup.position.set(0, 0, 0);
                    wandGroup.rotation.set(0, 0, 0);
                }
            } else if (activeController === controller) {
                if (handPos.distanceTo(holsterPos) < 0.4) {
                    attachWandToHolster();
                }
            }
        }

        function onTriggerDown(event) {
            const controller = event.target;
            if (!isWandInHand || activeController !== controller) return;

            const tipWorldPos = new THREE.Vector3();
            wandTipMesh.getWorldPosition(tipWorldPos);

            const wandDirection = new THREE.Vector3();
            wandGroup.getWorldDirection(wandDirection);
            wandDirection.negate();

            const spellGeo = new THREE.SphereGeometry(0.035, 16, 16);
            const spellMat = new THREE.MeshBasicMaterial({ color: 0xff0044 });
            const spell = new THREE.Mesh(spellGeo, spellMat);

            const spellLight = new THREE.PointLight(0xff0044, 4, 4);
            spell.add(spellLight);

            spell.position.copy(tipWorldPos);
            scene.add(spell);

            const speed = 0.5;
            const interval = setInterval(() => {
                spell.position.addScaledVector(wandDirection, speed);
                if (spell.position.distanceTo(tipWorldPos) > 30) {
                    scene.remove(spell);
                    spell.geometry.dispose();
                    spell.material.dispose();
                    clearInterval(interval);
                }
            }, 16);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function render(time) {
            // Lebegő gyertyák lágy hullámzó animációja
            const t = time * 0.0015;
            floatingCandles.forEach(c => {
                c.group.position.y = c.baseY + Math.sin(t + c.offset) * 0.12;
            });

            if (renderer.xr.isPresenting) {
                const xrCamera = renderer.xr.getCamera();
                xrCamera.getWorldPosition(headPos);
                xrCamera.getWorldDirection(headDir);

                const yaw = Math.atan2(headDir.x, headDir.z) + Math.PI;

                // Törzs követése a fej alatt
                playerBody.position.set(headPos.x, headPos.y, headPos.z);
                playerBody.rotation.y = yaw;

                // Öv pozíciója a csípőnél
                const sideOffset = new THREE.Vector3(0.22, -0.55, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                beltHolster.position.copy(headPos).add(sideOffset);
                beltHolster.rotation.y = yaw;
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
